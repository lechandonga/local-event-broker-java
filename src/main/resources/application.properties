server.port=8080

# ===== 本地事件 Broker 配置 =====
# 数据目录：事件日志（仅追加）与消费组状态文件都落在这里，重启后自动恢复
local.broker.data-dir=${user.home}/.local-event-broker/data
# 每个主题的默认容量（主题中保存的最大事件数）；发布超限会被明确拒绝（HTTP 429）
local.broker.default-capacity=10000
# 最大投递尝试次数（含首次），超过后进入死信
local.broker.default-max-attempts=5
# 重试指数退避：base * factor^(attempts-1)，封顶 max
local.broker.default-retry-backoff-base=1s
local.broker.default-retry-backoff-factor=2
local.broker.default-retry-backoff-max=5m
# 消费租约：拉取后多久未确认会被回收并重新投递
local.broker.default-lease-duration=30s
# 过期租约扫描周期
local.broker.reaper-interval=2s

# 按主题覆盖容量（可选）
#local.broker.topics.orders.capacity=100
# 按“消费组@主题”覆盖重试/租约（可选）
#local.broker.groups.billing@orders.max-attempts=3
#local.broker.groups.billing@orders.lease-duration=5s
#local.broker.groups.billing@orders.retry-backoff-base=200ms

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
